<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>عناويني - Blink</title>
    
    <!-- Core (Theme & Lang) -->
    <script src="core.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="addresses.css">
</head>
<body>

<!-- Header -->
<header class="app-header">
    <button class="header-btn" onclick="history.back()" aria-label="رجوع">
        <i data-lucide="arrow-right"></i>
    </button>
    <h1>عناويني</h1>
    <div class="header-spacer"></div>
</header>

<div class="container">

    <!-- Stats Bar -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-icon"><i data-lucide="map-pin"></i></div>
            <div class="stat-info">
                <span><strong id="totalCount">0</strong> عنوان محفوظ</span>
            </div>
        </div>
        <div class="stat-item">
            <div class="stat-icon"><i data-lucide="check-circle-2"></i></div>
            <div class="stat-info">
                <span><strong id="defaultCount">0</strong> افتراضي</span>
            </div>
        </div>
    </div>

    <!-- Add Button -->
    <button id="addAddressBtn" class="btn btn-primary btn-full add-btn">
        <i data-lucide="plus"></i>
        <span>إضافة عنوان جديد</span>
    </button>

    <!-- Addresses List -->
    <div id="addressesList" class="addresses-list">
        <!-- سيتم توليد القائمة هنا بواسطة JS -->
    </div>

</div>

<!-- Modal: Add / Edit Address -->
<div id="addressModal" class="modal-overlay hidden">
    <div class="modal-card">
        
        <div class="modal-header">
            <h2 id="modalTitle">إضافة عنوان جديد</h2>
            <button class="header-btn" onclick="closeAddressModal()" aria-label="إغلاق">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="modal-body">
            <!-- Search Bar -->
            <div class="search-bar">
                <i data-lucide="search"></i>
                <input type="text" id="addressSearchInput" placeholder="ابحث عن منطقة أو شارع..." autocomplete="off">
                <button type="button" class="search-go-btn" id="searchGoBtn" aria-label="بحث">
                    <i data-lucide="arrow-left"></i>
                </button>
                <div id="searchSuggestions" class="search-suggestions hidden"></div>
            </div>

            <!-- Map Picker -->
            <div class="map-wrapper">
                <div id="mapPicker"></div>
                <button type="button" class="gps-btn" id="gpsBtn" title="استخدم موقعي الحالي">
                    <i data-lucide="crosshair"></i>
                </button>
                <div class="map-hint">
                    <i data-lucide="move"></i>
                    <span>اسحب الدبوس لتحديد الموقع بدقة</span>
                </div>
            </div>

            <!-- Address Type Tabs -->
            <div class="type-tabs">
                <button type="button" class="type-tab active" data-type="home">
                    <i data-lucide="home"></i>
                    <span>المنزل</span>
                </button>
                <button type="button" class="type-tab" data-type="work">
                    <i data-lucide="briefcase"></i>
                    <span>العمل</span>
                </button>
                <button type="button" class="type-tab" data-type="other">
                    <i data-lucide="map-pin"></i>
                    <span>آخر</span>
                </button>
            </div>

            <!-- Address Input -->
            <div class="form-group">
                <label for="addressInput">العنوان الكامل *</label>
                <div class="input-wrapper">
                    <i data-lucide="map-pin" class="input-icon"></i>
                    <input type="text" id="addressInput" placeholder="مثال: حي موريتانيا، وجدة" required>
                </div>
            </div>

            <!-- Details Input -->
            <div class="form-group">
                <label for="detailsInput">تفاصيل إضافية (اختياري)</label>
                <div class="input-wrapper">
                    <i data-lucide="info" class="input-icon"></i>
                    <input type="text" id="detailsInput" placeholder="مثال: قرب مسجد، الطابق الثاني...">
                </div>
            </div>

            <!-- Phone Input -->
            <div class="form-group">
                <label for="phoneInput">رقم الهاتف (اختياري)</label>
                <div class="input-wrapper">
                    <i data-lucide="phone" class="input-icon"></i>
                    <input type="tel" id="phoneInput" placeholder="06XXXXXXXX" >
                </div>
            </div>

            <!-- Default Toggle -->
            <label class="switch-row">
                <div class="switch-info">
                    <i data-lucide="star"></i>
                    <span>تعيين كعنوان افتراضي</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="defaultToggle">
                    <span class="slider"></span>
                </div>
            </label>

        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="closeAddressModal()">إلغاء</button>
            <button type="button" class="btn btn-primary" id="saveAddressBtn">
                <span>حفظ</span>
            </button>
        </div>

    </div>
</div>

<!-- Confirm Delete Modal -->
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-card modal-sm">
        <div class="confirm-icon">
            <i data-lucide="trash-2"></i>
        </div>
        <h3>حذف العنوان</h3>
        <p>هل أنت متأكد من حذف هذا العنوان نهائياً؟</p>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeConfirmModal()">إلغاء</button>
            <button class="btn btn-danger" id="confirmActionBtn">حذف</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Main Logic -->
<script type="module" src="addresses.js"></script>
</body>
</html>
