<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <script src="core.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Quickly - Panier</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="cart.css">
</head>
<body>
  
  <header class="cart-header">
    <a href="#" id="backBtn" class="back-btn" aria-label="Retour">
      <i data-lucide="arrow-left"></i>
    </a>
    
    <div class="header-title">
      <h2 id="pageTitle">Votre panier</h2>
      <span id="vendorName" class="vendor-name"></span>
    </div>
    
    <button id="clearBtn" class="clear-btn" hidden>
      <i data-lucide="trash-2"></i>
      <span id="clearLabel" data-i18n="clear">Vider</span>
    </button>
  </header>
  
  <div id="vendorConflict" class="conflict" hidden></div>
  
  <main id="cartItems" aria-live="polite"></main>
  
  <footer class="cart-footer" id="cartFooter">
    <div class="summary-breakdown" id="cartSummaryBreakdown">
      <div class="summary-row">
        <span id="subtotalLabel" data-i18n="subtotal">Sous-total</span>
        <span id="subtotalValue">0.00 DH</span>
      </div>
      <div class="summary-row">
        <span id="deliveryLabel" data-i18n="delivery">Livraison</span>
        <span id="deliveryValue">10.00 DH</span>
      </div>
      <div class="summary-row summary-total">
        <span id="totalLabel" data-i18n="total">Total</span>
        <strong id="cartTotal">0.00 DH</strong>
      </div>
    </div>
    
    <p class="fees-note" id="feesNote"></p>
    
    <button id="checkoutBtn" data-i18n="checkout">Passer la commande</button>
  </footer>
  
  <script type="module" src="cart-page.js"></script>
</body>
</html>
