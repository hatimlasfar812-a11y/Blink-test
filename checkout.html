<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <script src="core.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Quickly - Caisse & Validation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="checkout.css">
</head>

<body>

  <!-- Top Header -->
  <header class="top-header">
    <button id="backBtn" class="back-btn" aria-label="Retour">
      <i data-lucide="arrow-left"></i>
    </button>
    <h2 data-i18n="checkout_title">Finaliser la commande</h2>
  </header>

  <main class="container">

    <!-- Delivery Address Card -->
    <div class="card">
      <div class="card-header">
        <h3>
          <i data-lucide="map-pin"></i>
          <span data-i18n="delivery_address">Adresse de livraison</span>
        </h3>
        <button id="changeAddress" class="btn-change-addr" data-i18n="change">Changer</button>
      </div>
      <p id="deliveryAddress" class="address-text">Sélectionnez une adresse de livraison</p>
    </div>

    <!-- Order Summary Card -->
    <div class="card">
      <h3>
        <i data-lucide="shopping-bag"></i>
        <span data-i18n="order_summary">Résumé de la commande</span>
      </h3>
      <div id="orderItems" class="order-items-list"></div>
    </div>

    <!-- Delivery Notes Card -->
    <div class="card">
      <h3>
        <i data-lucide="file-text"></i>
        <span data-i18n="delivery_notes">Instructions pour le livreur</span>
      </h3>
      <textarea id="orderNote" class="styled-textarea" data-i18n-placeholder="notes_placeholder" placeholder="Ex: Veuillez sonner à l'interphone, étage 2..."></textarea>
    </div>

    <!-- Payment Method Card -->
    <div class="card">
      <h3>
        <i data-lucide="credit-card"></i>
        <span data-i18n="payment_method">Mode de paiement</span>
      </h3>

      <label class="payment-option active">
        <input type="radio" name="payment" value="Cash" checked>
        <div class="pay-info">
          <strong data-i18n="cash_pay">Paiement à la livraison (Cash)</strong>
          <p data-i18n="cash_pay_desc">Payez en espèces dès réception de votre commande.</p>
        </div>
      </label>

      <label class="payment-option disabled">
        <input type="radio" disabled>
        <div class="pay-info">
          <strong data-i18n="card_pay">Carte Bancaire (CB)</strong>
          <span class="coming-badge" data-i18n="coming_soon">Bientôt disponible</span>
        </div>
      </label>

      <label class="payment-option disabled">
        <input type="radio" disabled>
        <div class="pay-info">
          <strong data-i18n="wallet_pay">Solde Quickly Wallet</strong>
          <span class="coming-badge" data-i18n="coming_soon">Bientôt disponible</span>
        </div>
      </label>
    </div>

    <!-- Coupon Card -->
    <div class="card">
      <h3>
        <i data-lucide="ticket"></i>
        <span data-i18n="coupon_code">Code Promo</span>
      </h3>
      <div class="coupon-box">
        <input type="text" id="couponInput" placeholder="Entrez votre code promo">
        <button id="applyCouponBtn" data-i18n="apply">Appliquer</button>
      </div>
      <small id="couponMessage" class="coupon-msg"></small>
    </div>

    <!-- Price Summary Card -->
    <div class="card price-card">
      <div class="price-row">
        <span data-i18n="subtotal">Sous-total</span>
        <b id="subtotal">0.00 DH</b>
      </div>
      <div class="price-row">
        <span data-i18n="delivery_fee">Frais de livraison</span>
        <b id="deliveryFee">0.00 DH</b>
      </div>
      <div class="price-row">
        <span data-i18n="service_fee">Frais de service</span>
        <b id="serviceFee">0.00 DH</b>
      </div>
      <div class="price-row discount-row" id="discountRow" style="display:none;">
        <span data-i18n="discount">Réduction</span>
        <b id="discountAmount">-0.00 DH</b>
      </div>
      <hr class="price-divider">
      <div class="price-row total-row">
        <span data-i18n="total_pay">Total à payer</span>
        <b id="totalPrice">0.00 DH</b>
      </div>
    </div>

  </main>

  <!-- Sticky Bottom Action Bar -->
  <div class="bottom-bar">
    <button id="placeOrder" class="btn-place-order">
      <span data-i18n="confirm_order">Valider la commande</span>
    </button>
  </div>

  <!-- Toast for notifications -->
  <div id="checkoutToast" class="toast-notification"></div>

  <script type="module" src="checkout.js"></script>
</body>
</html>
