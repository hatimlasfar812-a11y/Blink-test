<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F8FAFC">
    <meta name="description" content="Sign in to your Blink account and enjoy a seamless delivery experience.">
    <title>Sign In | Blink</title>
    
    <!-- Theme & Language Manager -->
    <script src="core.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Authentication Styles -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

<main class="auth-wrapper">
    <section class="auth-container" aria-label="Blink authentication">
        
        <!-- Brand & Header -->
        <header class="auth-header">
            <div class="brand">
                <img src="Blink1.png" alt="Blink Logo" class="brand-logo-img" width="190" height="54">
            </div>
            <h1 class="auth-title" data-i18n="welcome">Welcome Back</h1>
            <p class="auth-subtitle" data-i18n="subtitle">Sign in to continue to Blink</p>
        </header>

        <!-- Authentication Actions -->
        <section class="auth-actions" aria-label="Sign in options">
            <!-- Google Login -->
            <button type="button" id="googleLogin" class="btn btn-outline">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="google-icon" width="20" height="20">
                <span data-i18n="continue_google">Continue with Google</span>
            </button>

            <!-- Divider -->
            <div class="divider" role="separator">
                <span data-i18n="or">or</span>
            </div>

            <!-- Phone Login -->
            <button type="button" id="phoneLogin" class="btn btn-primary">
                <i data-lucide="smartphone" class="btn-icon" aria-hidden="true"></i>
                <span data-i18n="continue_phone">Continue with Phone</span>
            </button>
        </section>

        <!-- Phone Authentication Form (Hidden by default) -->
        <form id="phoneForm" class="phone-form hidden" onsubmit="return false;">
            <div class="input-wrapper">
                <i data-lucide="phone" class="input-icon" aria-hidden="true"></i>
                <input type="tel" id="phoneInput" name="phone" placeholder="+212 6 XX XX XX XX" autocomplete="tel" inputmode="tel" aria-label="Phone number">
            </div>
            <button type="button" id="sendCodeBtn" class="btn btn-primary btn-full" data-i18n="continue_btn">
                Continue
            </button>
            <button type="button" id="cancelPhoneBtn" class="btn btn-text" data-i18n="cancel">
                Cancel
            </button>
        </form>

        <!-- Firebase reCAPTCHA -->
        <div id="recaptcha-container" class="recaptcha-container"></div>

        <!-- Authentication Error -->
        <div id="errorMessage" class="alert alert-error hidden" role="alert" aria-live="polite"></div>

        <!-- Footer -->
        <footer class="auth-footer">
            <div class="features-row">
                <div class="feature-item">
                    <i data-lucide="shield-check" class="feat-icon" aria-hidden="true"></i>
                    <span data-i18n="feat2_title">Secure Account</span>
                </div>
                <div class="feature-item">
                    <i data-lucide="map-pin" class="feat-icon" aria-hidden="true"></i>
                    <span data-i18n="feat3_title">Live Tracking</span>
                </div>
            </div>
            <p class="policy-text" data-i18n="policy">
                By continuing you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.
            </p>
        </footer>

    </section>
</main>

<!-- Initialize Icons -->
<script>
    if (window.lucide) {
        window.lucide.createIcons();
    }
</script>

<!-- Firebase Authentication Logic -->
<script type="module" src="login.js"></script>
</body>
</html>
