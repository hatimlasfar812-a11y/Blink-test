<!DOCTYPE html>
<html lang="fr" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <script src="core.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  
  <title>Quickly - Succès</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Lucide Icons -->

  <link rel="stylesheet" href="order-success.css">
</head>
<body>
  
  <div class="success-card">
    
    <!-- أيقونة النجاح -->

    <h1 data-i18n="order_placed">Commande Validée !</h1>
    
    <p data-i18n="order_received">Votre commande a été reçue avec succès.</p>
    
    <!-- مربع رقم الطلب -->
    <div class="order-box">
      <p data-i18n="order_number">Numéro de commande</p>
      <h2 id="orderNumber">...</h2>
    </div>
    
    <!-- الأزرار -->
    <a href="my-orders.html" class="btn-primary" data-i18n="my_orders">Mes Commandes</a>
    <a href="index.html" class="btn-outline" data-i18n="back_home">Retour à l'accueil</a>
    
  </div>
  
  <script type="module" src="order-success.js"></script>

</html>
